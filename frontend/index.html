<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeHack - Hackathon Discovery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>🚀 VibeHack</h1>
                <p class="subtitle">Discover Your Next Hackathon</p>
            </div>
            <div class="header-actions">
                <button id="loginBtn" class="btn btn-primary">Login</button>
                <button id="logoutBtn" class="btn btn-secondary" style="display:none;">Logout</button>
            </div>
        </header>

        <!-- Search Section -->
        <section class="search-section">
            <input
                type="text"
                id="searchInput"
                class="search-input"
                placeholder="Search hackathons by title, tech, or location..."
            >
            <button id="searchBtn" class="btn btn-primary">Search</button>
            <button id="aiSearchBtn" class="btn btn-accent" title="AI-powered semantic search">🤖 AI Search</button>
            <button id="refreshBtn" class="btn btn-secondary" title="Refresh data from parsers">🔄 Refresh Data</button>
        </section>

        <!-- Error/Success Messages -->
        <div id="messageBox" class="message-box" style="display:none;"></div>

        <!-- Loading Indicator -->
        <div id="loadingIndicator" class="loading" style="display:none;">
            <div class="spinner"></div>
            <p>Loading...</p>
        </div>

        <!-- Hackathons List -->
        <section class="hackathons-section">
            <div id="hackathonsList" class="hackathons-grid">
                <!-- Hackathons will be inserted here -->
            </div>
        </section>

        <!-- Pagination -->
        <div class="pagination">
            <button id="prevBtn" class="btn btn-secondary" style="display:none;">← Previous</button>
            <span id="pageInfo">Page 1</span>
            <button id="nextBtn" class="btn btn-secondary" style="display:none;">Next →</button>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="modal" style="display:none;">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Login</h2>
            <form id="loginForm">
                <input type="email" id="emailInput" placeholder="Email" required>
                <input type="text" id="nameInput" placeholder="Name" required>
                <button type="submit" class="btn btn-primary">Dev Login</button>
                <p class="helper-text">Using dev login for testing. In production, use Google OAuth.</p>
            </form>
        </div>
    </div>

    <!-- Hackathon Detail Modal -->
    <div id="detailModal" class="modal" style="display:none;">
        <div class="modal-content modal-large">
            <span class="close">&times;</span>
            <div id="hackathonDetail"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
